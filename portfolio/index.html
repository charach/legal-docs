  .rows { border-top: 1px solid var(--line); }

  a.row .d { font-size: 15px; color: var(--ink-2); margin-top: 6px; max-width: 62ch; }
  a.row .meta { text-align: right; white-space: nowrap; }
  a.row .meta .tags { font-size: 13px; color: var(--ink-2); }
  .empty { padding: 26px 0; font-size: 14px; color: var(--ink-2); }

  @media (max-width: 640px) {
    a.row { grid-template-columns: 1fr; gap: 8px; padding: 22px 0; }
    a.row .t { font-size: 19px; }
    a.row .meta { text-align: left; }
  }
</style>
