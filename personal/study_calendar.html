<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- pwa -->
<meta name="theme-color" content="#FAFDFD">
<link rel="apple-touch-icon" href="assets/icons/calendar-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="assets/icons/calendar-180.png">
<link rel="manifest" href="assets/calendar.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘">
<!-- /pwa -->
<title>오늘 할 일</title>
<link rel="stylesheet" href="assets/summer.css">
<style>
  .today-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .today-head .dt { font-size: clamp(28px, 5vw, 44px); font-weight: 600; letter-spacing: -0.02em; }
  .today-head .ph { font-size: 14px; color: var(--ink-2); }
  .today-head .min { margin-left: auto; font-size: 14px; color: var(--ink-2); }
  .focus { font-size: 16px; color: var(--ink-2); margin-bottom: 36px; max-width: 62ch; }
  .focus b { color: var(--ink); font-weight: 600; }

  .anchor-line { font-size: 15px; color: var(--accent); margin-bottom: 18px; }

  ul.tasks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  ul.tasks li { display: grid; grid-template-columns: 18px 1fr; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: start; }
  ul.tasks label { cursor: pointer; display: block; }
  ul.tasks .kind { font-size: 12px; color: var(--ink-2); letter-spacing: 0.04em; display: block; margin-bottom: 3px; }
  ul.tasks .txt { font-size: 16px; line-height: 1.6; }
  ul.tasks .sub { display: block; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
  ul.tasks li.done .txt { color: var(--ink-2); text-decoration: line-through; text-decoration-color: #CFE3E7; }
  .tasks-foot { display: flex; align-items: center; gap: 16px; margin-top: 20px; font-size: 13px; color: var(--ink-2); }
  .tasks-foot .meter { flex: 1; }

  .restday { padding: 40px 0 44px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .restday .h { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 6px; }
  .restday .p { font-size: 15px; color: var(--ink-2); }

  .countdown { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
  .countdown > div { padding: 20px 20px 20px 0; border-bottom: 1px solid var(--line); }
  .countdown .n { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .countdown .n.near { color: var(--accent); }
  .countdown .l { font-size: 13px; color: var(--ink-2); margin-top: 2px; }

  .calhead { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .calhead .m { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; min-width: 140px; }
  .calhead .sp { margin-left: auto; }
  .cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .cal th { font-size: 12px; font-weight: 400; color: var(--ink-2); padding-bottom: 10px; text-align: center; border-bottom: 1px solid var(--line); }
  .cal td { border-bottom: 1px solid var(--line); padding: 0; text-align: center; vertical-align: top; }
  .cal button.day {
    width: 100%; min-height: 64px; padding: 10px 2px 8px; background: none; border: 0; cursor: pointer;
    font-family: var(--sans); display: flex; flex-direction: column; align-items: center; gap: 7px;
    border-top: 2px solid transparent; transition: background-color .2s ease;
  }
  .cal button.day:hover { background: #F2F8F9; }
  .cal .n { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cal .out .n { color: #C9DDE1; }
  .cal .rest .n { color: var(--ink-2); }
  .cal .today { border-top-color: var(--accent); }
  .cal .today .n { color: var(--accent); font-weight: 600; }
  .cal .sel { background: #F2F8F9; }
  .cal .dots { display: flex; gap: 3px; min-height: 5px; align-items: center; }
  .cal .dot { width: 4px; height: 4px; background: var(--ink-2); }
  .cal .dot.done { background: #C9DDE1; }
  .cal .mark { width: 5px; height: 5px; background: var(--accent); }
  .cal button.day:disabled { cursor: default; }
  .cal button.day:disabled:hover { background: none; }

  .callegend { margin-top: 18px; font-size: 13px; color: var(--ink-2); display: flex; gap: 22px; flex-wrap: wrap; }
  .callegend span { display: inline-flex; align-items: center; gap: 7px; }
  .callegend i { width: 4px; height: 4px; background: var(--ink-2); display: inline-block; }
  .callegend i.a { width: 5px; height: 5px; background: var(--accent); }

  .loaderr { border: 1px solid var(--line); border-radius: 8px; padding: 24px; font-size: 15px; color: var(--ink-2); line-height: 1.7; }
  .loading { color: var(--ink-2); font-size: 15px; padding: 60px 0; }

  @media (max-width: 640px) {
    .today-head .min { margin-left: 0; width: 100%; }
    .countdown { grid-template-columns: 1fr; }
    .countdown > div { padding: 16px 0; }
    .calhead .m { min-width: 0; font-size: 17px; flex: 1; }
    .cal button.day { min-height: 56px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="inner">
    <a class="brand" href="index.html">Personal</a>
    <div class="links">
      <a href="study_calendar.html" aria-current="page">오늘</a>
      <a href="ai_grad_prep.html">로드맵</a>
      <a href="interview_prep.html">면접</a>
      <a href="grad_schools.html">대학원</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap-narrow">
    <div class="eyebrow" style="margin-bottom:22px">Daily</div>
    <div id="loading" class="loading">불러오는 중</div>
    <div id="loaderr" class="loaderr" style="display:none">
      데이터를 읽지 못했다. 파일을 브라우저로 직접 열면(<code>file://</code>) 보안 정책 때문에 JSON을 읽을 수 없다.
      <code>python3 -m http.server</code> 로 띄운 뒤 <code>localhost:8000</code> 으로 열 것.
    </div>

    <div id="app" style="display:none">
      <div class="today-head">
        <span class="dt" id="dt">—</span>
        <span class="ph" id="ph"></span>
        <span class="min tnum" id="min"></span>
      </div>
      <p class="focus" id="focus"></p>
      <div id="anchors"></div>
      <div id="taskbox"></div>
    </div>
  </div>
</header>

<main id="rest" style="display:none">

  <section class="band">
    <div class="wrap-narrow">
      <div class="eyebrow" style="margin-bottom:18px">남은 날</div>
      <div class="countdown" id="countdown"></div>
    </div>
  </section>

  <section class="band band-last">
    <div class="wrap-narrow">
      <div class="calhead">
        <span class="m" id="mlabel">—</span>
        <button class="btn btn-ghost btn-sm" id="prev">이전</button>
        <button class="btn btn-ghost btn-sm" id="next">다음</button>
        <button class="btn btn-ghost btn-sm sp" id="gotoday">오늘</button>
      </div>
      <table class="cal">
        <thead><tr id="calhead"></tr></thead>
        <tbody id="calbody"></tbody>
      </table>
      <div class="callegend">
        <span><i></i>할 일 있는 날</span>
        <span><i class="a"></i>일정·마감</span>
        <span>금요일은 쉰다</span>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="wrap-narrow">
    <a href="ai_grad_prep.html">전체 로드맵</a> · <a href="interview_prep.html">면접 질문은행</a> · <a href="index.html">처음으로</a>
    <div style="margin-top:8px">체크는 이 브라우저에만 저장된다 · 원본 <code>data/study_plan.json</code></div>
  </div>
</footer>

<script>
(function(){
  "use strict";
  var STORE = 'aiGradPlan.v2', DAYSTORE = 'aiGradDaily.v1';
  var P = null, done = {}, daily = {}, sel = null, view = null;
  var WD = ['일','월','화','수','목','금','토'];
  var today = new Date(); today.setHours(0,0,0,0);

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>'); }
  function el(id){ return document.getElementById(id); }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function pd(s){ return new Date(s+'T00:00:00'); }
  function span(a,b){ return Math.round((b-a)/86400000); }

  fetch('data/study_plan.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){ P=j; init(); })
    .catch(function(){ el('loading').style.display='none'; el('loaderr').style.display='block'; });

  function init(){
    try { done = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ done={}; }
    try { daily = JSON.parse(localStorage.getItem(DAYSTORE)) || {}; } catch(e){ daily={}; }
    el('loading').style.display='none';
    el('app').style.display='block';
    el('rest').style.display='block';
    sel = new Date(today); view = new Date(today.getFullYear(), today.getMonth(), 1);
    el('calhead').innerHTML = WD.map(function(w){ return '<th>'+w+'</th>'; }).join('');
    renderCountdown(); renderCal(); renderDay();
    el('prev').onclick = function(){ view.setMonth(view.getMonth()-1); renderCal(); };
    el('next').onclick = function(){ view.setMonth(view.getMonth()+1); renderCal(); };
    el('gotoday').onclick = function(){ sel = new Date(today); view = new Date(today.getFullYear(), today.getMonth(), 1); renderCal(); renderDay(); };
  }

  function weekOf(d){ var s=iso(d); for (var i=0;i<P.weeks.length;i++){ var w=P.weeks[i]; if (s>=w.from && s<=w.to) return w; } return null; }
  function phaseOf(w){ return w ? (P.phases.filter(function(p){ return p.id===w.phase; })[0]||null) : null; }
  function anchorsOn(d){ var s=iso(d); return P.anchors.filter(function(a){ return a.date===s; }); }

  function tasksFor(d){
    var w = weekOf(d);
    if (!w) return { none:true, items:[], anchors:anchorsOn(d) };
    var wd = d.getDay()===0 ? 7 : d.getDay();
    var r = P.rhythm[String(wd)] || { min:0, kind:'rest' };
    var items = [];
    if (r.kind==='learn')    items.push({ id:'W:'+w.id+'.lesson',   kind:'강의·책',   text:w.lesson,   sub:r.min+'분' });
    if (r.kind==='recall')   items.push({ id:'D:'+iso(d)+'.recall', kind:'녹음',      text:w.review,   sub:r.min+'분 · 개념 하나를 30초로 말해 녹음' });
    if (r.kind==='practice') items.push({ id:'W:'+w.id+'.practice', kind:'실습',      text:w.practice, sub:r.min+'분 · 빈 화면에서 시작' });
    if (r.kind==='review')   items.push({ id:'W:'+w.id+'.review',   kind:'주간 정리',  text:w.review,   sub:r.min+'분 · 이번 주 배운 걸 말로 설명' });
    if (wd===1) (w.todos||[]).forEach(function(td,i){
      items.push({ id:'W:'+w.id+'.todo'+i, kind:'할 일', text:td.t, sub:'이번 주 안에' }); });
    return { rest:r.kind==='rest', week:w, phase:phaseOf(w), items:items, min:r.min, anchors:anchorsOn(d) };
  }

  function isDone(id){ return id.indexOf('W:')===0 ? !!done[id.slice(2)] : !!daily[id.slice(2)]; }
  function setDone(id,v){
    var k = id.slice(2);
    if (id.indexOf('W:')===0) { if(v) done[k]=1; else delete done[k];
      try{ localStorage.setItem(STORE, JSON.stringify(done)); }catch(e){} }
    else { if(v) daily[k]=1; else delete daily[k];
      try{ localStorage.setItem(DAYSTORE, JSON.stringify(daily)); }catch(e){} }
  }

  function renderDay(){
    var t = tasksFor(sel);
    var isToday = iso(sel)===iso(today);
    el('dt').textContent = (sel.getMonth()+1)+'월 '+sel.getDate()+'일 '+WD[sel.getDay()]+'요일';
    el('ph').textContent = (isToday ? '오늘' : '') + (t.phase ? (isToday?' · ':'') + t.phase.no+'단계 '+t.phase.title : '');
    el('min').textContent = t.min ? t.min+'분' : '';
    el('focus').innerHTML = t.week ? '이번 주 · <b>'+fmt(t.week.focus)+'</b>' : '계획 구간 밖이다.';
    el('anchors').innerHTML = t.anchors.map(function(a){
      return '<p class="anchor-line">'+esc(a.label)+'</p>'; }).join('');

    if (t.none) { el('taskbox').innerHTML = ''; return; }
    if (t.rest) {
      el('taskbox').innerHTML = '<div class="restday"><div class="h">쉬는 날</div>' +
        '<div class="p">밀린 것이 있으면 30분만. 없으면 아무것도 하지 않는다.</div></div>';
      return;
    }

    var n = t.items.filter(function(i){ return isDone(i.id); }).length;
    var pct = t.items.length ? Math.round(n/t.items.length*100) : 0;
    el('taskbox').innerHTML = '<ul class="tasks">' + t.items.map(function(it){
      var on = isDone(it.id);
      return '<li'+(on?' class="done"':'')+'><input class="chk" type="checkbox" data-id="'+esc(it.id)+'"'+(on?' checked':'')+'>' +
        '<label><span class="kind">'+esc(it.kind)+'</span><span class="txt">'+fmt(it.text)+'</span>' +
        (it.sub?'<span class="sub">'+esc(it.sub)+'</span>':'')+'</label></li>';
    }).join('') + '</ul>' +
    '<div class="tasks-foot"><span class="tnum">'+n+' / '+t.items.length+'</span>' +
    '<span class="meter"><i style="width:'+pct+'%"></i></span><span class="tnum">'+pct+'%</span></div>';

    el('taskbox').querySelectorAll('input.chk').forEach(function(cb){
      cb.addEventListener('change', function(){
        setDone(this.dataset.id, this.checked);
        renderDay(); renderCal();
      });
    });
  }

  function renderCountdown(){
    var picks = P.anchors.filter(function(a){ return span(today, pd(a.date)) >= 0; }).slice(0,3);
    if (!picks.length) picks = P.anchors.slice(-3);
    el('countdown').innerHTML = picks.map(function(a){
      var dd = span(today, pd(a.date));
      return '<div><div class="n tnum'+(dd<=30?' near':'')+'">'+(dd===0?'당일':'D-'+dd)+'</div>' +
             '<div class="l">'+esc(a.label.replace(/\s*\(.*?\)/,''))+'</div></div>'; }).join('');
  }

  function renderCal(){
    el('mlabel').textContent = view.getFullYear()+'년 '+(view.getMonth()+1)+'월';
    var first = new Date(view.getFullYear(), view.getMonth(), 1);
    var start = new Date(first); start.setDate(1 - first.getDay());
    var html = '';
    for (var w=0; w<6; w++){
      html += '<tr>';
      for (var i=0; i<7; i++){
        var d = new Date(start); d.setDate(start.getDate() + w*7 + i);
        var out = d.getMonth() !== view.getMonth();
        if (out) { html += '<td><button class="day out" disabled><span class="n">'+d.getDate()+'</span></button></td>'; continue; }
        var t = tasksFor(d);
        var cls = 'day';
        if (t.rest || t.none) cls += ' rest';
        if (iso(d)===iso(today)) cls += ' today';
        if (iso(d)===iso(sel)) cls += ' sel';
        var dots = t.items.map(function(it){ return '<span class="dot'+(isDone(it.id)?' done':'')+'"></span>'; }).join('');
        if (t.anchors.length) dots = '<span class="mark"></span>' + dots;
        html += '<td><button class="'+cls+'" data-d="'+iso(d)+'"><span class="n">'+d.getDate()+'</span>' +
                '<span class="dots">'+dots+'</span></button></td>';
      }
      html += '</tr>';
    }
    el('calbody').innerHTML = html;
    el('calbody').querySelectorAll('button.day:not(.out)').forEach(function(b){
      b.addEventListener('click', function(){
        sel = pd(this.dataset.d); renderCal(); renderDay();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }
})();
</script>
</body>
</html>
