<title>전신 근력 13주 캘린더</title>
<link rel="stylesheet" href="assets/summer.css">
<style>
  :root {
    --bg: #FAFDFD;
    --bg-2: #F2F8F9;
    --card: #FFFFFF;
    --ink: #1A2E35;
    --ink-soft: #5C7A85;
    --muted: #5C7A85;
    --line: #E4EFF1;
    --line-strong: #CFE3E7;

    --sky: #0E7C94;
    --sky-deep: #0E7C94;
    --blue: #0E7C94;
    --cyan: #0E7C94;
    --teal: #0E7C94;
    --indigo: #5C7A85;
    --violet: #5C7A85;
    --amber: #5C7A85;
    --gold: #5C7A85;
    --slate: #5C7A85;

    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    --shadow: 0 1px 3px rgba(26,46,53,.06);
    --shadow-lg: 0 1px 3px rgba(26,46,53,.06);
    --radius: 8px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    background:
      rgba(14,165,233,.10),
      rgba(20,184,166,.08),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }

  /* ---------- Header ---------- */
  header.hero {
    padding: 40px 0 18px;
    text-align: center;
  }
  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--sky-deep); font-weight: 700;
    background: rgba(14,165,233,.10);
    padding: 6px 14px; border-radius: 6px; margin-bottom: 16px;
  }
  header.hero h1 {
    font-weight: 900;
    font-size: clamp(26px, 6vw, 44px);
    line-height: 1.15; margin: 0 0 10px; letter-spacing: -.5px;
  }
  header.hero h1 .swim { color: var(--cyan); }
  header.hero h1 .bike { color: var(--blue); }
  header.hero h1 .run  { color: var(--teal); }
  header.hero h1 { max-width: none; }
  .slot .body .txt { line-height: 1.75; }
  header.hero p.sub { color: var(--ink-soft); margin: 0 auto; max-width: 560px; font-size: 14px; }

  /* ---------- Legend ---------- */
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px;
    margin: 22px auto 10px; max-width: 760px;
  }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
  .lg .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }

  /* ---------- Calendar ---------- */
  .month { margin: 26px 0 8px; }
  .month-head {
    display: flex; align-items: baseline; gap: 10px; margin: 0 4px 12px;
  }
  .month-head h2 { font-size: 19px; font-weight: 900; margin: 0; letter-spacing: -.3px; }
  .month-head .en { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .dow {
    text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted);
    padding-bottom: 2px;
  }
  .dow.sat { color: var(--blue); }
  .dow.sun { color: #5C7A85; }

  .cell {
    position: relative; aspect-ratio: 1 / 1.06;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 6px 5px;
    display: flex; flex-direction: column; overflow: hidden;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .cell.empty { background: transparent; border: 1px dashed transparent; box-shadow: none; }
  .cell.pad { visibility: hidden; }
  .cell.active { cursor: pointer; box-shadow: var(--shadow); }
  .cell.active:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
  .cell .dnum { font-size: 13px; font-weight: 800; color: var(--ink); line-height: 1; }
  .cell .hol { font-size: 9px; color: #5C7A85; font-weight: 700; margin-top: 2px; }
  .cell .mini {
    margin-top: auto; font-size: 10px; line-height: 1.28; color: var(--ink-soft);
    font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .cell .dots { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
  .cell .dots i { width: 7px; height: 7px; border-radius: 50%; display: block; }

  /* kinds */
  .cell.k-rest { background: #F2F8F9; }
  .cell.k-rest .dnum { color: var(--slate); }
  .cell.k-long { background: #F2F8F9; border-color:#E4EFF1; }
  .cell.k-race {
    background: #E4EFF1;
    border-color: #5C7A85; box-shadow: 0 1px 3px rgba(26,46,53,.06);
  }
  .cell.k-race .dnum { color: #0E7C94; }
  .cell.k-race .mini { color: #1A2E35; font-weight: 800; }

  /* 공휴일 · 헬스장 휴무 */
  .cell.k-closed { background: #E4EFF1; border-style: dashed; border-color: #5C7A85; }
  .cell.k-closed .dnum { color: #1A2E35; }
  .cell.k-closed .hol  { color: #1A2E35; font-weight: 800; }
  .cell.k-closed .mini { color: #1A2E35; font-weight: 700; }

  /* today */
  .cell.today { border: 2px solid var(--sky); box-shadow: 0 1px 3px rgba(26,46,53,.06); }
  .cell.today::before {
    content: "오늘"; position: absolute; top: 5px; right: 5px;
    font-size: 8.5px; font-weight: 800; color: #fff; background: var(--sky);
    padding: 1px 6px; border-radius: 6px; letter-spacing: .04em;
  }
  .cell.today .dnum { color: var(--sky-deep); }
  .cell.holiday .dnum { color: #5C7A85; }
  .cell.holiday.today .dnum { color: var(--sky-deep); }

  /* phase ribbon (left accent) */
  .cell .ph { position:absolute; left:0; top:0; bottom:0; width:3px; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(9,30,52,.55);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 50; padding: 0;
  }
  .overlay.open { display: flex; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--card); width: 100%; max-width: 520px;
    border-radius: 8px 24px 0 0; padding: 8px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow: 0 1px 3px rgba(26,46,53,.06);
    animation: slideup .26s cubic-bezier(.22,1,.36,1);
    max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
    transition: transform .26s cubic-bezier(.22,1,.36,1);
    will-change: transform; touch-action: pan-y;
  }
  .modal.dragging { transition: none; animation: none; }
  @keyframes slideup { from { transform: translateY(40px); } to { transform: translateY(0); } }
  .modal .grabber {
    position: sticky; top: 0; z-index: 2;
    width: 100%; padding: 12px 0 10px; margin: 0 auto 6px;
    display: flex; justify-content: center; cursor: grab;
    background: var(--card);
  }
  .modal .grabber::before {
    content: ""; width: 44px; height: 5px; border-radius: 6px;
    background: var(--line-strong); transition: background .15s, width .15s;
  }
  .modal.dragging .grabber { cursor: grabbing; }
  .modal.dragging .grabber::before { background: var(--sky); width: 54px; }
  .modal .m-date { font-size: 12px; font-weight: 700; color: var(--sky-deep); letter-spacing: .04em; }
  .modal .m-title { font-size: 22px; font-weight: 900; margin: 4px 0 2px; letter-spacing: -.4px; }
  .modal .m-phase {
    display: inline-block; font-size: 11.5px; font-weight: 700; color: #fff;
    padding: 3px 10px; border-radius: 6px; margin-top: 8px;
  }
  .modal .m-goal {
    background: var(--bg-2); border-radius: 8px; padding: 11px 13px; margin: 14px 0 4px;
    font-size: 12.5px; color: var(--ink-soft); line-height: 1.55;
  }
  .modal .m-goal b { color: var(--ink); }
  .slot {
    display: flex; gap: 12px; padding: 13px; margin-top: 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #FAFDFD;
  }
  .slot.am { background: #F2F8F9; border-color:#E4EFF1; }
  .slot.pm { background: #FAFDFD; border-color:#E4EFF1; }
  .slot .ic {
    flex: none; width: 42px; height: 42px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    background: var(--bg-2); box-shadow: 0 1px 3px rgba(26,46,53,.06);
  }
  .slot .ic.am { background: #5C7A85; }
  .slot .ic.pm { background: #CFE3E7; }
  .slot .body .when { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .slot .body .txt { font-size: 14px; line-height: 1.55; margin-top: 2px; color: var(--ink); }
  .slot .body .txt b { color: var(--sky-deep); }
  .m-note {
    margin-top: 14px; font-size: 12.5px; color: var(--ink-soft);
    background: #F2F8F9; border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 13px; line-height: 1.55;
  }
  .m-note b { color: var(--sky-deep); }
  .m-vac {
    margin-top: 14px; background: #CFE3E7;
    border: 1px solid #5C7A85; border-radius: 8px; padding: 11px 13px;
    font-size: 12.5px; color: #1A2E35; font-weight: 600; line-height: 1.55;
  }
  .m-vac b { color: #1A2E35; }
  .m-routine { margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .m-routine .rt-head {
    background: #E4EFF1; padding: 10px 13px;
    font-weight: 800; font-size: 13px; color: #0E7C94;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .m-routine .rt-head .t { font-size: 11px; font-weight: 700; color: #5C7A85; white-space: nowrap; }
  .m-routine ul { margin: 0; padding: 6px 13px 8px; list-style: none; }
  .m-routine li {
    font-size: 13px; padding: 6px 0 6px 22px; position: relative; color: var(--ink);
    border-top: 1px solid var(--line);
  }
  .m-routine li:first-child { border-top: none; }
  .m-routine li::before { content: ''; position: absolute; left: 0; top: 6px; font-size: 12px; }
  .m-routine li b { color: #5C7A85; }
  .m-routine li .h { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 3px; line-height: 1.45; }
  .m-routine .rt-note { font-size: 12px; color: #5C7A85; padding: 9px 13px; background: #FAFDFD; border-top: 1px solid var(--line); line-height: 1.5; }
  .m-routine .rt-foot { font-size: 11px; color: var(--muted); padding: 8px 13px; background: var(--bg-2); line-height: 1.5; }
  .m-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .m-tag { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 6px; color: #fff; }
  .m-close {
    margin-top: 18px; width: 100%; text-align: center;
    background: var(--ink); color: #fff; border: none; border-radius: 8px;
    padding: 13px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    touch-action: manipulation; position: relative; z-index: 3;
  }
  .m-close:active { background: #1A2E35; }

  /* ---------- Footer note ---------- */
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin: 40px 0 0; line-height: 1.7; }
  .foot b { color: var(--ink-soft); }

  /* Floating today button */
  .fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 40;
    background: var(--sky-deep); color: #fff;
    border: none; border-radius: 6px; padding: 13px 22px; font-family: inherit;
    font-weight: 800; font-size: 14px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(26,46,53,.06);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .fab:active { transform: translateX(-50%) scale(.97); }

  /* ---------- Responsive ---------- */
  @media (min-width: 620px) {
    .cell .mini { font-size: 11px; -webkit-line-clamp: 3; }
    .cell .dnum { font-size: 14px; }
    .grid { gap: 9px; }
    .overlay { align-items: center; padding: 20px; }
    .modal { border-radius: 8px; max-height: 86vh; }
  }
  @media (max-width: 480px) {
    .wrap { padding-left: 12px; padding-right: 12px; }
    .grid { gap: 5px; }
    .cell { border-radius: 10px; padding: 5px 4px 4px; }
    .cell .mini { display: none; }
    .cell .dots { margin-top: auto; }
  }

</style>
</head>

<div class="wrap">

  <header class="hero">
    <span class="kicker">GYM · SWIM · RUN</span>
    <h1>전신 근력<br>13주 캘린더</h1>
    <p class="sub">평일 아침 헬스장 · 월·수 저녁 수영 · 토 평로라 · 일 롱런<br><b>2026. 10. 8 ~ 2027. 1. 3</b> · 공휴일은 헬스장 휴무로 집 운동 전환</p>

</div>

<button class="fab" id="fab">오늘 운동</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div id="modalContent"></div>
    <button class="m-close" id="closeBtn">닫기</button>
  </div>
</div>

<script>
/* ---------- 동작: [헬스장 이름, 맨몸 대체] ---------- */
const EX = {
  goblet:   ['고블릿 스쿼트',            '맨몸 스쿼트 · 3초 내려가기'],
  backsq:   ['바벨 백스쿼트',            '불가리안 스플릿 스쿼트(맨몸)'],
  legpress: ['레그 프레스',              '워킹 런지'],
  calf:     ['스탠딩 카프 레이즈',        '계단 카프 레이즈'],

  cablerow: ['시티드 케이블 로우',        '식탁 인버티드 로우'],

  bbrow:    ['바벨 로우',                '인버티드 로우 · 발 의자 위 · 1초 멈춤'],
  facepull: ['페이스 풀',                '프론 YTW'],
  dbcurl:   ['덤벨 컬',                  '배낭 컬 (책 넣은 배낭)'],
  dbbench:  ['덤벨 벤치프레스',           '푸시업'],

  ohp:      ['바벨 오버헤드 프레스',       '파이크 푸시업 · 발 의자 위'],
  pushpress:['푸시 프레스',              '폭발 푸시업'],
  rdl_db:   ['덤벨 RDL',                 '한 다리 RDL(맨몸)'],

  sl_rdl:   ['한 다리 덤벨 RDL',          '한 다리 RDL(맨몸)'],

  hipthr:   ['바벨 힙 쓰러스트',          '한 다리 글루트 브리지 · 어깨 소파에'],

/* 맨몸 대체에서 처방이 달라지는 것 */
const ALT_RX = {
  goblet:'3×20', backsq:'3×12 / 다리', legpress:'3×12 / 다리', calf:'3×20', calf1:'3×15 / 다리', boxjump:'3×6',

  { id:'p0', from:'2026-10-08', to:'2026-10-18', name:'회복',  color:'#5C7A85' },

const LIGHT = [['2026-11-16','2026-11-22'],['2026-12-28','2027-01-03']];
const HOLIDAYS = { '2026-10-09':'한글날', '2026-12-25':'성탄절', '2027-01-01':'신정' };

/* ---------- 하루 만들기 ---------- */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pd(s){ return new Date(s+'T00:00:00'); }
const inR = (s,a,b) => s>=a && s<=b;
const phaseOf = s => PHASES.find(p => inR(s,p.from,p.to));
const isLight = s => LIGHT.some(r => inR(s,r[0],r[1]));
const two = rx => rx.replace(/^3×/,'2×');

function day(s){
  const ph = phaseOf(s); if(!ph) return null;
  const dow = pd(s).getDay();
  const week = Math.floor((pd(s)-pd(WEEK0))/86400000/7) + 1;
  const pm = (dow===1||dow===3) ? '수영 레슨' : '';
  let title = TITLE[dow], s4 = [], c = null, alt = null, light = false, tags = [];

  if (ph.id === 'p0') {
    const early = s < '2026-10-14';
    if (dow === 6) { c = early ? '평로라 40~60분 · 아주 가볍게' : '평로라 존2 60분 · NP 130~140W'; }
    else if (dow === 0) { title = early ? '걷기' : '이지 러닝'; c = early ? '걷기 · 조깅 20~30분' : '이지 러닝 45분'; }
    else if (early) { title = '회복'; s4 = [['mob','8분']]; c = '러닝머신 경사 걷기 20분 · 가볍게'; alt = '걷기 20분'; }
    else {
      s4 = W.p1[dow].s.map(x => [x[0], two(x[1]) + (/^(pushup|sideplank|deadbug|clam|monster|copen|nordic)$/.test(x[0]) ? '' : ' · 가벼운 무게')]);
      if (W.p1[dow].c) { c = (dow===2 ? '로잉머신' : '러닝머신') + ' 이지 25분'; alt = '이지 러닝 25분'; }
      light = true;
    }
  } else {
    const w = W[ph.id][dow];
    light = isLight(s);
    s4 = (w.s||[]).map(x => [x[0], light ? two(x[1]) : x[1]]);
    if (w.c) { c = light ? LIGHT_C[dow][0] : w.c; alt = light ? (LIGHT_C[dow][1]||null) : (w.alt||null); }
  }
  /* 공휴일엔 헬스장이 쉰다. 기구나 머신이 필요한 날이면 그날 계획을 집 운동으로 돌린다 */
  const hol = HOLIDAYS[s] || null;
  const mobOnly = s4.length === 1 && s4[0][0] === 'mob';
  const needsGym = s4.some(x => x[0] !== 'mob') || /러닝머신|로잉머신/.test(c || '');
  const closed = !!hol && needsGym;

  if (closed) tags.push('closed');
  else if (s4.length && !mobOnly) tags.push('gym');
  if (c) tags.push(/로잉|러닝|롱런|걷기|조깅/.test(c) ? 'run' : 'bike');
  if (/로잉/.test(c||'')) { tags.pop(); tags.push(closed ? 'run' : 'row'); }
  if (pm && !closed) tags.push('swim');
  if (mobOnly && !closed) tags.unshift('rest');
  return { s, ph, week, dow, title, s4, c, alt, pm, light, tags, hol, closed, mobOnly };
}

/* ---------- drag-to-dismiss (mobile bottom sheet) ---------- */
(function(){
  const modal = document.getElementById('modal');
  const DISMISS = 110;   // 이만큼 내리면 닫힘
  const SLOP = 10;       // 탭과 드래그를 구분하는 여유 거리
  let startY = 0, dy = 0, tracking = false, dragging = false, canDrag = false;

  function reset(){
    modal.style.transform = '';
    overlay.style.background = '';
  }
  function down(e){
    tracking = false; dragging = false; dy = 0;
    // 버튼·링크 위에서 시작한 터치는 드래그로 가로채지 않는다 (닫기 버튼 탭 보호)
    if(e.target.closest('button, a, input, textarea, select')) return;
    const t = e.touches ? e.touches[0] : e;
    startY = t.clientY;
    tracking = true;
    canDrag = modal.scrollTop <= 0;   // pull-to-dismiss only from the top
  }
  function move(e){
    if(!tracking) return;
    const t = e.touches ? e.touches[0] : e;
    dy = t.clientY - startY;
    if(!dragging){
      // SLOP 이전에는 preventDefault 하지 않음 → 탭이 click 으로 정상 변환됨
      if(!canDrag || dy <= SLOP) return;
      dragging = true;
      modal.classList.add('dragging');
    }
    if(e.cancelable) e.preventDefault();
    const off = Math.max(0, dy - SLOP);
    modal.style.transform = 'translateY(' + off + 'px)';
    overlay.style.background = 'rgba(9,30,52,' + Math.max(0, 0.55 - off/800) + ')';
  }
  function up(){
    if(!tracking) return;
    tracking = false;
    if(!dragging) return;             // 단순 탭 → 아무 동작도 하지 않음
    dragging = false;
    modal.classList.remove('dragging');
    if(dy - SLOP > DISMISS){
      modal.style.transform = 'translateY(100%)';
      overlay.style.background = 'rgba(9,30,52,0)';
      setTimeout(function(){ closeModal(); reset(); }, 220);
    } else {
      reset();
    }
  }
  modal.addEventListener('touchstart', down, {passive:true});
  modal.addEventListener('touchmove', move, {passive:false});
  modal.addEventListener('touchend', up);
  modal.addEventListener('touchcancel', up);
})();

document.getElementById('closeBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if(e.target===overlay) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });


/* ---------- 오늘 버튼 ---------- */
function goToday(){
  let ds = todayStr;
  if (!day(ds)) ds = todayStr < START ? START : END;
  openModal(ds);
  const el = document.querySelector('.cell.today') || document.querySelector('[data-date="'+ds+'"]');
  if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
}
document.getElementById('fab').addEventListener('click', goToday);
const fab = document.getElementById('fab');
new MutationObserver(()=>{ fab.style.display = overlay.classList.contains('open') ? 'none' : ''; }).observe(overlay, {attributes:true, attributeFilter:['class']});
</script>
