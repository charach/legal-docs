<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0ea5e9">
<title>Personal · 개인 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f8fc;
    --card: #ffffff;
    --ink: #0f2740;
    --ink-soft: #486079;
    --muted: #8aa0b5;
    --line: #dfeaf3;
    --line-strong: #c7dcec;
    --sky: #0ea5e9;
    --sky-deep: #0284c7;
    --teal: #14b8a6;
    --violet: #8b5cf6;
    --sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --shadow: 0 1px 2px rgba(15,39,64,.05), 0 8px 24px rgba(15,39,64,.06);
    --shadow-lg: 0 14px 44px rgba(2,132,199,.18), 0 4px 12px rgba(15,39,64,.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; color: var(--ink); font-family: var(--sans);
    font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(14,165,233,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 20%, rgba(20,184,166,.08), transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px calc(80px + env(safe-area-inset-bottom)); }

  header.hero { padding: 56px 0 26px; text-align: center; }
  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11.5px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--sky-deep); font-weight: 700;
    background: rgba(14,165,233,.10); padding: 6px 14px; border-radius: 999px; margin-bottom: 16px;
  }
  header.hero h1 { font-weight: 900; font-size: clamp(28px, 7vw, 44px); margin: 0 0 8px; letter-spacing: -.5px; }
  header.hero p { color: var(--ink-soft); margin: 0; font-size: 14px; }

  .cards { display: grid; gap: 14px; margin-top: 8px; }

  a.card {
    display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; box-shadow: var(--shadow);
    transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    position: relative; overflow: hidden;
  }
  a.card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: var(--accent, var(--sky));
  }
  a.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--line-strong); }
  a.card:active { transform: translateY(-1px); }

  a.card .ic {
    flex: none; width: 58px; height: 58px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    background: var(--ic-bg, #e6f3fb);
  }
  a.card .body { min-width: 0; flex: 1; }
  a.card .tag {
    display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent, var(--sky-deep));
    background: var(--ic-bg, #e6f3fb); padding: 2px 9px; border-radius: 999px; margin-bottom: 7px;
  }
  a.card h2 { font-size: 18px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.3px; line-height: 1.3; }
  a.card p { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  a.card .arrow { flex: none; color: var(--muted); font-size: 22px; transition: transform .14s ease, color .14s ease; }
  a.card:hover .arrow { transform: translateX(4px); color: var(--accent, var(--sky-deep)); }

  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; }

  @media (max-width: 480px) {
    a.card { padding: 16px; gap: 13px; }
    a.card .ic { width: 50px; height: 50px; font-size: 24px; border-radius: 13px; }
    a.card h2 { font-size: 16px; }
    a.card .arrow { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="kicker">🗂 Personal</span>
    <h1>개인 페이지</h1>
    <p>보고 싶은 페이지를 선택하세요</p>
  </header>

  <div class="cards">

    <a class="card" href="exercise.html" style="--accent:#0ea5e9;--ic-bg:#e0f2fe">
      <span class="ic">🏊‍♂️</span>
      <span class="body">
        <span class="tag">Training</span>
        <h2>2026 구례 아이언맨 훈련 캘린더</h2>
        <p>74일 일자별 훈련 · 매일 클릭하면 아침·저녁 운동 팝업 (7/22 ~ 10/4)</p>
      </span>
      <span class="arrow">→</span>
    </a>

    <a class="card" href="career_roadmap.html" style="--accent:#8b5cf6;--ic-bg:#ede9fe">
      <span class="ic">🚀</span>
      <span class="body">
        <span class="tag">Career</span>
        <h2>커리어 전환 로드맵</h2>
        <p>삼성전자 → AI Product Engineer 단계별 전환 계획</p>
      </span>
      <span class="arrow">→</span>
    </a>

  </div>

  <p class="foot">🔒 개인용 · 검색 비노출</p>
</div>
</body>
</html>
